<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calibrate — mj</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#1a1a2e; --panel:#16213e; --panel2:#0d1830; --border:#0f3460;
    --accent:#e94560; --accent2:#22e4ff; --text:#e0e0e0; --dim:#8a97b5;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:none;
    -webkit-user-select:none;user-select:none}

  /* ---- top toolbar ---- */
  #bar{position:fixed;left:0;right:0;top:0;height:46px;z-index:10;display:flex;align-items:center;gap:10px;
    padding:0 10px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap}
  #bar .logo{color:var(--accent);font-weight:800;text-decoration:none;font-size:15px;letter-spacing:.02em}
  #bar .title{color:var(--dim);font-size:12px;margin-right:4px}
  .sep{width:1px;height:24px;background:var(--border);flex:0 0 auto}
  .grp{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .grp .lbl{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
  button.tool,button.act{background:var(--panel2);color:var(--text);border:1px solid var(--border);
    border-radius:5px;padding:6px 9px;font-size:12px;font-weight:600;cursor:pointer;flex:0 0 auto}
  button.tool:hover,button.act:hover{border-color:var(--accent)}
  button.tool.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.act.primary{background:var(--border)}
  button.act.primary:hover{background:#1a4a8a}
  .swatch{width:20px;height:20px;border-radius:4px;border:2px solid rgba(255,255,255,.25);cursor:pointer;flex:0 0 auto}
  .swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  input[type=color]{width:26px;height:24px;padding:0;border:1px solid var(--border);background:var(--panel2);border-radius:4px;cursor:pointer}
  label.chk{color:var(--dim);font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer;flex:0 0 auto}

  /* ---- canvas ---- */
  #c{position:fixed;left:0;top:46px;right:0;bottom:0;display:block;cursor:crosshair;background:#0a0e1a}

  /* ---- overlays ---- */
  #help{position:fixed;left:10px;top:56px;z-index:5;font:600 11px/1.5 ui-monospace,"Courier New",monospace;
    color:#bfeede;text-shadow:0 1px 3px #000;pointer-events:none;white-space:pre}
  #panel{position:fixed;right:12px;bottom:14px;z-index:6;min-width:180px;max-width:44vw;
    background:rgba(13,24,48,.92);border:1px solid var(--border);border-radius:6px;padding:8px 10px;
    font:600 11px/1.5 ui-monospace,"Courier New",monospace;color:#ffd9a8}
  #panel .row{display:flex;align-items:center;gap:6px;margin-top:5px}
  #panel input.lab{flex:1;min-width:60px;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:4px;padding:3px 6px;font:600 11px ui-monospace,monospace}
  #panel button{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:4px;
    padding:3px 7px;font-size:11px;cursor:pointer}
  #panel button.del:hover{border-color:var(--accent);color:var(--accent)}
  #drop{position:fixed;inset:46px 0 0 0;z-index:8;display:none;align-items:center;justify-content:center;
    background:rgba(10,14,26,.8);border:3px dashed var(--accent2);color:var(--accent2);
    font:700 18px ui-monospace,monospace;pointer-events:none}
  #hint{position:fixed;left:0;right:0;top:46px;bottom:0;z-index:4;display:flex;align-items:center;justify-content:center;
    text-align:center;color:var(--dim);font-size:14px;pointer-events:none}
  #hint b{color:var(--text)}
  #panel .dim{color:var(--dim)}
  #panel button.go{border-color:var(--accent2)}
  input[type=file]{display:none}
</style>
</head>
<body>
  <div id="bar">
    <a class="logo" href="/">mj</a><span class="title">Calibrate</span>
    <span class="sep"></span>
    <div class="grp" id="tools">
      <span class="lbl">tool</span>
      <button class="tool" data-tool="point">Point</button>
      <button class="tool" data-tool="line">Line</button>
      <button class="tool" data-tool="rect">Rect</button>
      <button class="tool" data-tool="ellipse">Ellipse</button>
      <button class="tool" data-tool="quad" title="Four corners: drag a box, then drag each corner">Corners</button>
      <button class="tool" data-tool="sam" title="Segment Anything: click a shape or drag a box round it, and get its outline. Needs mj serve.">SAM</button>
      <button class="tool" data-tool="pan">Pan</button>
    </div>
    <span class="sep"></span>
    <div class="grp" id="colors"><span class="lbl">color</span></div>
    <input type="color" id="customColor" title="Custom colour">
    <span class="sep"></span>
    <div class="grp">
      <button class="act" id="btnFit" title="Fit image to view (F)">Fit</button>
      <button class="act" id="btnZoomIn" title="Zoom in">+</button>
      <button class="act" id="btnZoomOut" title="Zoom out">−</button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="act primary" id="btnLoadImg">Load Image</button>
      <button class="act" id="btnSave">Save JSON</button>
      <button class="act" id="btnCopy">Copy JSON</button>
      <button class="act" id="btnLoad">Load JSON</button>
      <label class="chk" title="Embed the full image (base64) inside the JSON so it reopens complete — off = small file, shapes + dimensions only"><input type="checkbox" id="embed"> embed image</label>
      <button class="act" id="btnClear" title="Delete all shapes">Clear</button>
    </div>
    <input type="file" id="fileImg" accept="image/*">
    <input type="file" id="fileJson" accept="application/json,.json">
  </div>

  <canvas id="c"></canvas>
  <div id="help"></div>
  <div id="hint">Load a room image — <b>Load Image</b> button, drag &amp; drop, or paste (Ctrl+V)</div>
  <div id="drop">drop image to load</div>
  <div id="panel"></div>

<script>
"use strict";
// mj calibration / markup tool. Load any image, zoom & pan, draw points, lines,
// rectangles, ellipses and four-cornered shapes, or have Segment Anything outline a
// shape (docs/tools/calibrate.md), label & colour them, save/load the markup as JSON.
// Coordinates are stored in IMAGE pixel space (independent of zoom/pan/dpr).
// Salvaged and generalised from the wcfranks skee-ball calibration editor.

const PALETTE=["#ff00ff","#00ffff","#ffff00","#00ff66","#ff8000","#ff2b2b","#ffffff","#000000"];
let currentColor=PALETTE[0];

const cv=document.getElementById("c"), ctx=cv.getContext("2d");
const helpEl=document.getElementById("help"), panelEl=document.getElementById("panel");
const hintEl=document.getElementById("hint"), dropEl=document.getElementById("drop");

// ---- image ----
const img=new Image();
let imgReady=false, imgName="", ART_W=1000, ART_H=1000;
function setImage(dataURL,name,cb){
  img.onload=()=>{ imgReady=true; ART_W=img.naturalWidth; ART_H=img.naturalHeight;
    imgName=name||"image"; samImage=null; sam=null; hintEl.style.display="none"; fit(); draw(); cb&&cb(); };
  img.onerror=()=>{ flash("Failed to load image"); };
  img.src=dataURL;
}

// ---- view (image->screen) ----
const view={scale:1,ox:0,oy:0}, DPR=Math.min(window.devicePixelRatio||1,2);
function fit(){
  const w=cv.clientWidth, h=cv.clientHeight;
  view.scale=Math.min(w/ART_W, h/ART_H)*0.95;
  view.ox=(w-ART_W*view.scale)/2; view.oy=(h-ART_H*view.scale)/2;
}
function zoomAt(f,sx,sy){
  const b=toImg(sx,sy);
  view.scale=Math.max(0.02,Math.min(40,view.scale*f));
  view.ox=sx-b.x*view.scale; view.oy=sy-b.y*view.scale;
}
const toImg=(sx,sy)=>({x:(sx-view.ox)/view.scale, y:(sy-view.oy)/view.scale});
const sX=ix=>view.ox+ix*view.scale, sY=iy=>view.oy+iy*view.scale;

// ---- shapes ----
// point   {type,x,y,label,color}
// line    {type,x1,y1,x2,y2,label,color}
// rect    {type,cx,cy,rx,ry,label,color}         (center + half-extents, axis-aligned)
// ellipse {type,cx,cy,rx,ry,rotation,label,color}
// outline {type,points:[[x,y],...],label,color}  (closed: the last point joins the first)
// quad    {type,points:[[x,y]×4],label,color}    (top left, top right, bottom right, bottom left)
let shapes=[];
let tool="point", sel=-1, action=null, grab=null, pan=null;
let cursorImg={x:0,y:0}, flashMsg="", flashT=0, spaceDown=false;

const rot=e=>Number.isFinite(e.rotation)?e.rotation:0;
const rad=e=>rot(e)*Math.PI/180;
const normRot=d=>((d+180)%360+360)%360-180;
function ellipseNorm(e,ix,iy){
  const a=rad(e),c=Math.cos(a),s=Math.sin(a),dx=ix-e.cx,dy=iy-e.cy;
  return Math.hypot((dx*c+dy*s)/Math.max(1e-3,e.rx), (-dx*s+dy*c)/Math.max(1e-3,e.ry));
}
function distSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,L2=dx*dx+dy*dy||1;
  let t=((px-x1)*dx+(py-y1)*dy)/L2; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
const isPoly=s=>s.type==="outline"||s.type==="quad";
function insidePoly(pts,x,y){ let on=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const [xi,yi]=pts[i],[xj,yj]=pts[j];
    if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi) on=!on; }
  return on; }
function polyEdge(pts,x,y){ let d=Infinity;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++) d=Math.min(d,distSeg(x,y,pts[j][0],pts[j][1],pts[i][0],pts[i][1]));
  return d; }
function polyArea(pts){ let a=0;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++) a+=pts[j][0]*pts[i][1]-pts[i][0]*pts[j][1];
  return Math.abs(a)/2; }
function polyBounds(pts){ const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]; }
// corner handles (image space) for the selected rect/ellipse
function corners(s){ return [[s.cx-s.rx,s.cy-s.ry],[s.cx+s.rx,s.cy-s.ry],[s.cx+s.rx,s.cy+s.ry],[s.cx-s.rx,s.cy+s.ry]]; }
function hitHandle(ix,iy){
  if(sel<0) return null; const s=shapes[sel]; const tol=9/view.scale;
  if(s.type==="line"){
    if(Math.hypot(ix-s.x1,iy-s.y1)<=tol) return {pt:1};
    if(Math.hypot(ix-s.x2,iy-s.y2)<=tol) return {pt:2};
  }else if(s.type==="rect"||s.type==="ellipse"){
    const cs=corners(s);
    for(let i=0;i<4;i++) if(Math.hypot(ix-cs[i][0],iy-cs[i][1])<=tol) return {corner:i};
  }else if(isPoly(s)){ let best=-1, near=tol;
    s.points.forEach(([x,y],i)=>{ const d=Math.hypot(ix-x,iy-y); if(d<=near){near=d;best=i;} });
    if(best>=0) return {v:best};
  }
  return null;
}
function hitShape(ix,iy){
  const tol=8/view.scale;
  let bestEdge=-1,bestED=Infinity, bestIn=-1,bestArea=Infinity;
  for(let i=0;i<shapes.length;i++){ const s=shapes[i];
    if(s.type==="point"){ const d=Math.hypot(ix-s.x,iy-s.y); if(d<=tol+3/view.scale&&d<bestED){bestED=d;bestEdge=i;} }
    else if(s.type==="ellipse"){ const n=ellipseNorm(s,ix,iy); const edge=Math.abs(n-1)*Math.min(s.rx,s.ry);
      if(edge<=tol&&edge<bestED){bestED=edge;bestEdge=i;} if(n<=1){const a=s.rx*s.ry; if(a<bestArea){bestArea=a;bestIn=i;}} }
    else if(s.type==="rect"){ const qx=Math.abs(ix-s.cx)-s.rx, qy=Math.abs(iy-s.cy)-s.ry; const inside=qx<=0&&qy<=0;
      const edge=inside?Math.min(-qx,-qy):Math.hypot(Math.max(qx,0),Math.max(qy,0));
      if(edge<=tol&&edge<bestED){bestED=edge;bestEdge=i;} if(inside){const a=s.rx*s.ry; if(a<bestArea){bestArea=a;bestIn=i;}} }
    else if(isPoly(s)){ const edge=polyEdge(s.points,ix,iy);
      if(edge<=tol&&edge<bestED){bestED=edge;bestEdge=i;}
      if(insidePoly(s.points,ix,iy)){const a=polyArea(s.points); if(a<bestArea){bestArea=a;bestIn=i;}} }
    else{ const d=distSeg(ix,iy,s.x1,s.y1,s.x2,s.y2); if(d<=tol&&d<bestED){bestED=d;bestEdge=i;} }
  }
  return bestEdge>=0?bestEdge:bestIn;
}

// ---- undo ----
const undoStack=[]; const MAX_UNDO=80; let lastTag=null;
function snap(){ return JSON.stringify(shapes); }
function pushUndo(tag){ undoStack.push(snap()); if(undoStack.length>MAX_UNDO)undoStack.shift(); lastTag=tag??null; }
function pushCoalesced(tag){ if(lastTag!==tag) pushUndo(tag); }
function endOp(){ if(undoStack.length&&undoStack[undoStack.length-1]===snap()) undoStack.pop(); lastTag=null; }
function undo(){ if(!undoStack.length){flash("Nothing to undo");return;}
  shapes=JSON.parse(undoStack.pop()); sel=-1; grab=null; lastTag=null; draw(); flash("Undo ("+undoStack.length+" left)"); }

// ---- pointer ----
function canvasXY(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);
  const cxy=canvasXY(e);
  if(e.button===1 || tool==="pan" || spaceDown){ e.preventDefault(); pan={x:cxy.x,y:cxy.y}; return; }
  const p=toImg(cxy.x,cxy.y);
  // SAM takes the canvas, but for a selected shape's handles. Not an outline's: they'd take every click near its edge,
  // and that's where SAM is wanted most
  if(tool==="sam"&&(sam||sel<0||shapes[sel].type==="outline"||!hitHandle(p.x,p.y))){ samDrag={start:p,now:p,no:e.altKey||e.shiftKey||e.button===2}; return; }
  // handle drag on the selected shape first (resize / endpoint / vertex)
  const h=e.shiftKey?null:hitHandle(p.x,p.y);
  if(h){ pushUndo(); grab=h; action={kind:h.corner!=null?"resize":h.v!=null?"moveVertex":"movePoint"}; return; }
  const hit=e.shiftKey?-1:hitShape(p.x,p.y);
  pushUndo();
  if(hit>=0){ sel=hit; grab=null; const s=shapes[hit];
    action={kind:"move", start:p, orig:JSON.parse(JSON.stringify(s))}; draw(); return; }
  // draw a new shape
  if(tool==="point"){ shapes.push({type:"point",x:p.x,y:p.y,label:"",color:currentColor});
    sel=shapes.length-1; action={kind:"place"}; }
  else if(tool==="ellipse"||tool==="rect"){ shapes.push({type:tool,cx:p.x,cy:p.y,rx:0,ry:0,label:"",color:currentColor});
    sel=shapes.length-1; action={kind:"draw", start:p}; }
  else if(tool==="quad"){ shapes.push({type:"quad",points:[0,1,2,3].map(()=>[p.x,p.y]),label:nextLabel("quad"),color:currentColor});
    sel=shapes.length-1; action={kind:"draw", start:p}; }
  else{ shapes.push({type:"line",x1:p.x,y1:p.y,x2:p.x,y2:p.y,label:"",color:currentColor});
    sel=shapes.length-1; action={kind:"draw", start:p}; }
  draw();
});
cv.addEventListener("pointermove",e=>{
  const cxy=canvasXY(e);
  if(pan){ view.ox+=cxy.x-pan.x; view.oy+=cxy.y-pan.y; pan={x:cxy.x,y:cxy.y}; draw(); return; }
  const p=toImg(cxy.x,cxy.y); cursorImg=p;
  if(samDrag){ samDrag.now=p; draw(); return; }
  if(action){ const s=shapes[sel];
    if(action.kind==="draw"){ if(s.type==="line"){s.x2=p.x;s.y2=p.y;}
      else if(s.type==="quad"){ const a=action.start, x0=Math.min(a.x,p.x), x1=Math.max(a.x,p.x), y0=Math.min(a.y,p.y), y1=Math.max(a.y,p.y);
        s.points=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]]; }
      else {s.rx=Math.max(1,Math.abs(p.x-s.cx));s.ry=Math.max(1,Math.abs(p.y-s.cy));} }
    else if(action.kind==="place"){ s.x=p.x; s.y=p.y; }
    else if(action.kind==="movePoint"){ if(grab.pt===1){s.x1=p.x;s.y1=p.y;} else {s.x2=p.x;s.y2=p.y;} }
    else if(action.kind==="moveVertex"){ s.points[grab.v]=[p.x,p.y]; }
    else if(action.kind==="resize"){ s.rx=Math.max(1,Math.abs(p.x-s.cx)); s.ry=Math.max(1,Math.abs(p.y-s.cy)); }
    else{ const dx=p.x-action.start.x, dy=p.y-action.start.y, o=action.orig;
      if(s.type==="point"){s.x=o.x+dx;s.y=o.y+dy;}
      else if(s.type==="line"){s.x1=o.x1+dx;s.y1=o.y1+dy;s.x2=o.x2+dx;s.y2=o.y2+dy;}
      else if(isPoly(s)){s.points=o.points.map(([x,y])=>[x+dx,y+dy]);}
      else{s.cx=o.cx+dx;s.cy=o.cy+dy;} }
  }
  draw();
});
cv.addEventListener("pointerup",()=>{
  if(pan){ pan=null; return; }
  if(samDrag){ samRelease(); return; }
  if(action&&action.kind==="draw"){ const s=shapes[sel];
    const tiny=s.type==="line"?Math.hypot(s.x2-s.x1,s.y2-s.y1)<2
      :s.type==="quad"?polyEdge([s.points[0]],s.points[2][0],s.points[2][1])<2:(s.rx<2&&s.ry<2);
    if(tiny){ shapes.pop(); sel=-1; } }
  action=null; grab=null; endOp(); draw();
});
cv.addEventListener("wheel",e=>{ e.preventDefault();
  zoomAt(e.deltaY<0?1.12:1/1.12, ...Object.values(canvasXY(e))); draw();
},{passive:false});
cv.addEventListener("contextmenu",e=>{ if(tool==="sam") e.preventDefault(); });
cv.addEventListener("dblclick",e=>{ if(tool==="sam") return;
  const p=toImg(...Object.values(canvasXY(e)));
  const hit=hitShape(p.x,p.y); if(hit<0) return;
  const v=prompt("Label:", shapes[hit].label||"");
  if(v!==null){ if(v.trim()!==shapes[hit].label) pushUndo(); shapes[hit].label=v.trim(); sel=hit; draw(); }
});

// ---- keyboard ----
addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") { if(e.key==="Escape"||e.key==="Enter") e.target.blur(); return; }
  if(e.code==="Space"){ spaceDown=true; cv.style.cursor="grab"; }
  if(sam&&samKey(e)) return;
  if((e.ctrlKey||e.metaKey)&&(e.key==="z"||e.key==="Z")){ e.preventDefault(); undo(); return; }
  if(e.ctrlKey||e.metaKey) return;
  const k=e.key.toLowerCase();
  if(k==="p"){ setTool("point"); } else if(k==="l"){ setTool("line"); }
  else if(k==="r"){ setTool("rect"); } else if(k==="e"){ setTool("ellipse"); }
  else if(k==="c"){ setTool("quad"); } else if(k==="s"){ setTool("sam"); }
  else if(k==="h"){ setTool("pan"); } else if(k==="f"){ fit(); draw(); }
  else if((e.key==="Delete"||e.key==="Backspace")&&sel>=0){ pushUndo(); shapes.splice(sel,1); sel=-1; e.preventDefault(); draw(); }
  else if(sel>=0 && e.key.indexOf("Arrow")===0){
    const n=e.shiftKey?10:1;
    const dx=e.key==="ArrowLeft"?-n:e.key==="ArrowRight"?n:0, dy=e.key==="ArrowUp"?-n:e.key==="ArrowDown"?n:0;
    pushCoalesced("arrow"+sel); const s=shapes[sel];
    if(s.type==="point"){s.x+=dx;s.y+=dy;}
    else if(s.type==="line"){ if(grab&&grab.pt===1){s.x1+=dx;s.y1+=dy;} else if(grab&&grab.pt===2){s.x2+=dx;s.y2+=dy;} else {s.x1+=dx;s.y1+=dy;s.x2+=dx;s.y2+=dy;} }
    else if(isPoly(s)){ s.points=s.points.map(([x,y])=>[x+dx,y+dy]); }
    else {s.cx+=dx;s.cy+=dy;}
    e.preventDefault(); draw();
  }
  else if((k===","||k===".")&&sel>=0&&(shapes[sel].type==="ellipse"||shapes[sel].type==="rect")){
    pushCoalesced("size"+sel); const s=shapes[sel], step=k==="."?1:-1;
    if(e.shiftKey&&s.type==="ellipse"){ s.rotation=normRot(rot(s)+step); }
    else { s.rx=Math.max(1,s.rx+step); s.ry=Math.max(1,s.ry+step); } draw();
  }
});
addEventListener("keyup",e=>{ if(e.code==="Space"){ spaceDown=false; cv.style.cursor="crosshair"; } });

// ---- draw ----
const BAR_H=46;
function resize(){
  // A <canvas> is a replaced element: left/right:0 won't stretch it, so set an
  // explicit CSS size (fill the viewport below the toolbar) AND the backing store.
  const W=Math.max(1,innerWidth), H=Math.max(1,innerHeight-BAR_H);
  cv.style.width=W+"px"; cv.style.height=H+"px";
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  draw();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const w=cv.clientWidth,h=cv.clientHeight;
  ctx.clearRect(0,0,w,h); ctx.fillStyle="#0a0e1a"; ctx.fillRect(0,0,w,h);
  if(imgReady) ctx.drawImage(img, view.ox, view.oy, ART_W*view.scale, ART_H*view.scale);
  shapes.forEach((s,i)=>{
    const on=i===sel; ctx.strokeStyle=s.color; ctx.fillStyle=s.color; ctx.lineWidth=on?2.4:1.6;
    if(s.type==="point"){
      const x=sX(s.x),y=sY(s.y),r=on?7:5;
      ctx.beginPath();ctx.moveTo(x-r-3,y);ctx.lineTo(x+r+3,y);ctx.moveTo(x,y-r-3);ctx.lineTo(x,y+r+3);ctx.stroke();
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(x,y,1.8,0,Math.PI*2);ctx.fill();
    }else if(s.type==="ellipse"){
      ctx.beginPath();ctx.ellipse(sX(s.cx),sY(s.cy),s.rx*view.scale,s.ry*view.scale,rad(s),0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(sX(s.cx),sY(s.cy),2.2,0,Math.PI*2);ctx.fill();
    }else if(s.type==="rect"){
      ctx.strokeRect(sX(s.cx-s.rx),sY(s.cy-s.ry),2*s.rx*view.scale,2*s.ry*view.scale);
      ctx.beginPath();ctx.arc(sX(s.cx),sY(s.cy),2.2,0,Math.PI*2);ctx.fill();
    }else if(isPoly(s)){
      polyPath(s.points); ctx.stroke();
      if(s.type==="quad") s.points.forEach(p=>{ ctx.beginPath();ctx.arc(sX(p[0]),sY(p[1]),on?3.5:2.6,0,Math.PI*2);ctx.fill(); });
    }else{
      ctx.beginPath();ctx.moveTo(sX(s.x1),sY(s.y1));ctx.lineTo(sX(s.x2),sY(s.y2));ctx.stroke();
      const r=on?4.5:2.6;
      ctx.beginPath();ctx.arc(sX(s.x1),sY(s.y1),r,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sX(s.x2),sY(s.y2),r,0,Math.PI*2);ctx.fill();
    }
    if(s.label){ const lx=labelX(s),ly=labelY(s);
      ctx.font="700 13px ui-monospace,'Courier New',monospace"; ctx.textAlign="left"; ctx.textBaseline="bottom";
      ctx.lineWidth=3.5; ctx.strokeStyle="rgba(0,0,0,.85)"; ctx.strokeText(s.label,lx+8,ly-6);
      ctx.fillStyle=s.color; ctx.fillText(s.label,lx+8,ly-6); }
  });
  // selection handles
  if(sel>=0){ const s=shapes[sel];
    ctx.fillStyle="#fff"; ctx.strokeStyle="#000"; ctx.lineWidth=1;
    const hd=(x,y,r=3.5)=>{ctx.fillRect(x-r,y-r,2*r,2*r);ctx.strokeRect(x-r,y-r,2*r,2*r);};
    if(s.type==="rect"||s.type==="ellipse") corners(s).forEach(c=>hd(sX(c[0]),sY(c[1])));
    else if(s.type==="line"){ hd(sX(s.x1),sY(s.y1)); hd(sX(s.x2),sY(s.y2)); }
    else if(isPoly(s)) s.points.forEach(p=>hd(sX(p[0]),sY(p[1]),s.type==="quad"?3.5:2));
  }
  drawSam();
  overlays();
}
function polyPath(pts){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(sX(p[0]),sY(p[1])):ctx.moveTo(sX(p[0]),sY(p[1]))); ctx.closePath(); }
const labelX=s=>s.type==="point"?sX(s.x):s.type==="line"?sX((s.x1+s.x2)/2):isPoly(s)?sX(polyBounds(s.points)[0]):sX(s.cx);
const labelY=s=>s.type==="point"?sY(s.y):s.type==="line"?sY((s.y1+s.y2)/2):isPoly(s)?sY(polyBounds(s.points)[1]):sY(s.cy-(s.ry||0));
function overlays(){
  helpEl.textContent =
    "[P]oint [L]ine [R]ect [E]llipse [C]orners [S]AM  [H]/space/mid-drag = pan   wheel = zoom  [F] = fit\n"+
    "drag = draw   click shape = select   drag handles = resize/move end   arrows = nudge (shift ×10)\n"+
    ", . = size ellipse/rect   shift+,. = rotate ellipse   dbl-click = label   Del = delete   Ctrl+Z = undo\n"+
    (tool==="sam"?"SAM: click = this, shift/alt/right-click = not this, drag = box   Tab = next answer, 1 2 3 = pick one\n"+
      "     A = add it to the outline here, X = cut it from that outline, zoom in first for finer edges\n"+
      "     Enter = keep as its own outline, C = keep four corners, Backspace = take back a click, Esc = cancel\n":"")+
    (imgReady?imgName+"  "+ART_W+"×"+ART_H+"   cursor "+cursorImg.x.toFixed(0)+", "+cursorImg.y.toFixed(0):"no image")+
    (Date.now()<flashT?"\n\n▶ "+flashMsg:"");

}

// ---- Segment Anything ----
// A click or a dragged box asks mj serve (POST /calibrate/sam) for SAM's three answers; more clicks refine them. SAM looks
// no wider than the screen, so zooming in gives finer edges. The answer then goes on the outline under it, added or cut
// (reshape, below), or is kept on its own, as an outline or four corners. A shape kept over one of its own type replaces
// it, and keeps its label, so a bad outline can be redone by clicking the door again. The picture goes to the server
// once, on the first ask.
let sam=null;       // {points:[{x,y,on}],box,answers,k,seq,busy,note}
let samDrag=null;   // the press being made: {start,now,no}
let samImage=null;  // the picture's id on the server
// What a hall's shapes are called, left to right: @overlore's game reads these (docs/tools/calibrate.md).
const HALL_LABELS={outline:["red","sun","tree","big","moon","trident","brown"], quad:["red","sun","tree","moon","trident","brown"]};
const NEAR=24;      // how close to an outline, in picture pixels, a piece counts as being meant for it
function nextLabel(type){
  if(!imgName.startsWith("hall-")) return "";
  const used=shapes.filter(s=>s.type===type).map(s=>s.label);
  return HALL_LABELS[type].find(l=>!used.includes(l))||"";
}
function samRelease(){
  const d=samDrag; samDrag=null;
  if(!imgReady) return;
  const inPicture=q=>q.x>=0&&q.y>=0&&q.x<ART_W&&q.y<ART_H;
  const dragged=(Math.abs(d.now.x-d.start.x)+Math.abs(d.now.y-d.start.y))*view.scale>6;
  if(!sam) sam={points:[],box:null,answers:[],k:0,seq:0,busy:false,note:""};
  if(dragged&&!d.no){
    const edge=(v,top)=>Math.max(0,Math.min(top,v));
    sam.box=[edge(Math.min(d.start.x,d.now.x),ART_W),edge(Math.min(d.start.y,d.now.y),ART_H),
             edge(Math.max(d.start.x,d.now.x),ART_W),edge(Math.max(d.start.y,d.now.y),ART_H)];
  }else if(inPicture(d.start)) sam.points.push({x:d.start.x,y:d.start.y,on:!d.no});
  samAsk();
}
async function samSendPicture(){
  const picture=await (await fetch(img.src)).blob();
  const r=await fetch("/calibrate/sam/image",{method:"POST",body:picture});
  if(r.status===404) throw new Error("This mj serve is older than the SAM tool: restart it (just serve).");
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||"the picture wasn't taken");
  samImage=d.image;
}
function samView(){
  const a=toImg(0,0), b=toImg(cv.clientWidth,cv.clientHeight);
  return [Math.max(0,a.x),Math.max(0,a.y),Math.min(ART_W,b.x),Math.min(ART_H,b.y)];
}
async function samPost(s){
  const r=await fetch("/calibrate/sam",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({image:samImage,points:s.points.map(p=>[p.x,p.y]),labels:s.points.map(p=>p.on?1:0),box:s.box,view:samView()})});
  return {missing:r.status===410, ...(await r.json())};
}
async function samAsk(){
  const s=sam; if(!s) return;
  if(!s.box&&!s.points.some(p=>p.on)){ s.answers=[]; s.note=s.points.length?"That's only \"not this\": click what you want too.":""; draw(); return; }
  const seq=++s.seq, current=()=>sam===s&&seq===s.seq;
  s.busy=true; s.note=""; draw();
  try{
    if(!samImage) await samSendPicture();
    let d=await samPost(s);
    if(d.missing){ await samSendPicture(); d=await samPost(s); }
    if(!current()) return; // a newer click is already asking
    if(d.error) s.note=d.error;
    else{ s.answers=d.answers; s.k=d.start; }
  }catch(err){
    if(current()) s.note=err.name==="TypeError"?"SAM needs mj serve (just serve).":err.message; // fetch's TypeError: nothing answered
  }
  if(current()){ s.busy=false; draw(); }
}
function samStep(n){ const c=sam.answers.length; if(c){ sam.k=(sam.k+n+c)%c; draw(); } }
function samBack(){
  if(sam.points.length) sam.points.pop(); else sam.box=null;
  if(!sam.points.length&&!sam.box){ sam=null; draw(); } else samAsk();
}
function samKeep(type){
  const a=sam&&sam.answers[sam.k]; if(!a) return;
  const points=(type==="quad"?a.corners:a.outline).map(p=>p.slice());
  const b=polyBounds(points), mid=[(b[0]+b[2])/2,(b[1]+b[3])/2];
  const old=shapes.findIndex(s=>{ if(s.type!==type) return false;
    const o=polyBounds(s.points); return insidePoly(s.points,...mid)&&insidePoly(points,(o[0]+o[2])/2,(o[1]+o[3])/2); });
  pushUndo();
  if(old>=0){ shapes[old]={...shapes[old],points}; sel=old; }
  else{ shapes.push({type,points,label:nextLabel(type),color:currentColor}); sel=shapes.length-1; }
  sam=null; draw();
  if(!shapes[sel].label){ const li=document.getElementById("labIn"); if(li) li.focus(); }
}
// The outline an answer would go on: the one it shares the most with, or else the nearest
function samTarget(a){
  if(a.target!==undefined) return a.target;
  let best=-1, most=0, nearest=NEAR;
  shapes.forEach((s,i)=>{ if(s.type!=="outline") return;
    const shared=a.outline.filter(p=>insidePoly(s.points,p[0],p[1])).length+s.points.filter(p=>insidePoly(a.outline,p[0],p[1])).length;
    if(shared>most){ most=shared; best=i; }
    else if(!most){ const d=Math.min(...a.outline.map(p=>polyEdge(s.points,p[0],p[1]))); if(d<nearest){ nearest=d; best=i; } }
  });
  return a.target=best;
}
function samEdit(cut){
  const a=sam&&sam.answers[sam.k]; if(!a) return;
  const t=samTarget(a);
  if(t<0){ if(cut){ sam.note="There's no outline here to cut from."; draw(); } else samKeep("outline"); return; }
  const name=shapes[t].label||"the outline", r=reshape(shapes[t].points,a.outline,cut);
  if(r.why){ sam.note={apart:"That doesn't touch "+name+": nothing to join it to.",
    inside:"That's wholly inside "+name+", and an outline can't have a hole.",all:"That would cut away all of "+name+"."}[r.why]; draw(); return; }
  pushUndo(); shapes[t].points=r.points; sel=t; sam=null; draw();
  if(r.split) flash("That cut "+name+" in two: kept the larger part");
}
function samKey(e){
  const k=e.key.toLowerCase(), press=fn=>{ e.preventDefault(); fn(); return true; };
  if(e.key==="Escape") return press(()=>{ sam=null; draw(); });
  if(e.key==="Enter") return press(()=>samKeep("outline"));
  if(k==="c"&&!e.ctrlKey&&!e.metaKey) return press(()=>samKeep("quad"));
  if(k==="a"&&!e.ctrlKey&&!e.metaKey) return press(()=>samEdit(false));
  if(k==="x"&&!e.ctrlKey&&!e.metaKey) return press(()=>samEdit(true));
  if(e.key==="Tab") return press(()=>samStep(e.shiftKey?-1:1));
  if(e.key>="1"&&e.key<="3"&&sam.answers[+e.key-1]) return press(()=>{ sam.k=+e.key-1; draw(); });
  if(e.key==="Backspace"||e.key==="Delete"||((e.ctrlKey||e.metaKey)&&k==="z")) return press(samBack);
  return false;
}
function drawSam(){
  const dash=box=>{ ctx.save(); ctx.setLineDash([6,4]); ctx.strokeStyle="#00ffff"; ctx.lineWidth=1.4;
    ctx.strokeRect(sX(box[0]),sY(box[1]),(box[2]-box[0])*view.scale,(box[3]-box[1])*view.scale); ctx.restore(); };
  if(samDrag&&!samDrag.no) dash([samDrag.start.x,samDrag.start.y,samDrag.now.x,samDrag.now.y]);
  if(!sam) return;
  if(sam.box) dash(sam.box);
  const a=sam.answers[sam.k], t=a?samTarget(a):-1;
  if(t>=0){ polyPath(shapes[t].points); ctx.strokeStyle="#fff"; ctx.lineWidth=3; ctx.stroke(); }
  if(a){ polyPath(a.outline); ctx.fillStyle="rgba(0,255,255,.16)"; ctx.fill(); ctx.strokeStyle="#00ffff"; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle="#00ff66"; a.corners.forEach(c=>{ ctx.beginPath();ctx.arc(sX(c[0]),sY(c[1]),3.5,0,Math.PI*2);ctx.fill(); }); }
  sam.points.forEach(p=>{ ctx.beginPath();ctx.arc(sX(p.x),sY(p.y),5,0,Math.PI*2);
    ctx.fillStyle=p.on?"#00ff66":"#ff2b2b"; ctx.fill(); ctx.strokeStyle="#000"; ctx.lineWidth=1.2; ctx.stroke(); });
}
function renderSamPanel(){
  const a=sam.answers[sam.k], w=a?a.bounds[2]-a.bounds[0]:0, h=a?a.bounds[3]-a.bounds[1]:0, t=a?samTarget(a):-1;
  panelEl.innerHTML=`<div>SAM${a?` answer ${sam.k+1} of ${sam.answers.length}`:""}</div>`+
    (a?`<div class="row dim">${w}×${h} px at ${a.bounds[0]}, ${a.bounds[1]}  score ${a.score}</div>`+
      `<div class="row dim">SAM saw ${a.crop[2]}×${a.crop[3]} px  ${t<0?"no outline here":"on "+((shapes[t].label||"an outline").replace(/</g,"&lt;"))}</div>`:"")+
    (sam.busy?`<div class="row dim">asking… (the first ask starts SAM, which takes a few seconds)</div>`:"")+
    (sam.note?`<div class="row">${sam.note.replace(/</g,"&lt;")}</div>`:"")+
    `<div class="row"><button id="samPrev">◀</button><button id="samNext">▶</button>`+
    `<button class="go" id="samAdd">Add</button><button class="go" id="samCut">Cut</button>`+
    `<button class="go" id="samOutline">Outline</button><button class="go" id="samCorners">Corners</button>`+
    `<button id="samCancel" style="margin-left:auto">Cancel</button></div>`;
  document.getElementById("samPrev").onclick=()=>samStep(-1);
  document.getElementById("samNext").onclick=()=>samStep(1);
  document.getElementById("samAdd").onclick=()=>samEdit(false);
  document.getElementById("samCut").onclick=()=>samEdit(true);
  document.getElementById("samOutline").onclick=()=>samKeep("outline");
  document.getElementById("samCorners").onclick=()=>samKeep("quad");
  document.getElementById("samCancel").onclick=()=>{ sam=null; draw(); };
}

// ---- outlines as pixels ----
// An outline is added to, or cut from, on pixels: both shapes filled in, one laid over the other, and the edge walked
// again. Points the change didn't touch go back exactly where they were, so fixing one stretch leaves the rest alone,
// however many times it's done.
const EDGE_EPS=1;   // how far an outline may stray from the pixels' edge
const RIBBON=3;     // half the width of the thin strips a change clears away beside itself (clearRibbons)
const MARGIN=8;     // blank pixels round a mask, more than clearRibbons reaches
const STEPS=[[1,0],[0,1],[-1,0],[0,-1]];  // east, south, west, north
// A blank mask over both outlines, with blank margin on every side
function maskOver(a,b){
  const p=polyBounds(a), q=polyBounds(b), x=Math.floor(Math.min(p[0],q[0]))-MARGIN, y=Math.floor(Math.min(p[1],q[1]))-MARGIN;
  const w=Math.ceil(Math.max(p[2],q[2]))+MARGIN-x, h=Math.ceil(Math.max(p[3],q[3]))+MARGIN-y;
  return {x,y,w,h,px:new Uint8Array(w*h)};
}
// Set each pixel whose centre is inside
function fillPoly(m,pts,on){
  for(let row=0;row<m.h;row++){
    const y=m.y+row+.5, xs=[];
    for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const [xi,yi]=pts[i],[xj,yj]=pts[j];
      if((yi>y)!==(yj>y)) xs.push(xi+(y-yi)*(xj-xi)/(yj-yi)); }
    xs.sort((a,b)=>a-b);
    for(let k=0;k+1<xs.length;k+=2)
      m.px.fill(on,row*m.w+Math.max(0,Math.ceil(xs[k]-m.x-.5)),row*m.w+Math.min(m.w,Math.ceil(xs[k+1]-m.x-.5)));
  }
}
// Mark the pixels joined to start, side by side, that match it. The margin is blank, so a run can't wrap round a row's end.
function flood(m,mark,start,id){
  const {w,px}=m, todo=[start]; let n=0; mark[start]=id;
  while(todo.length){ const i=todo.pop(); n++;
    for(const j of [i-1,i+1,i-w,i+w]) if(j>=0&&j<px.length&&!mark[j]&&px[j]===px[start]){ mark[j]=id; todo.push(j); } }
  return n;
}
// Down to the largest piece, with its holes filled: an outline can be neither two shapes nor a ring. Says how many it found.
function solidify(m){
  const mark=new Int32Array(m.px.length); let pieces=0, best=0, most=0;
  m.px.forEach((v,i)=>{ if(v&&!mark[i]){ const n=flood(m,mark,i,++pieces); if(n>most){ most=n; best=pieces; } } });
  m.px=m.px.map((v,i)=>mark[i]===best?1:0);
  const outside=new Int32Array(m.px.length); flood(m,outside,0,1);
  m.px=m.px.map((v,i)=>outside[i]?0:1);
  return pieces;
}
// Grown r pixels each way, by a square, which leaves a square corner square
function spread(px,w,r){
  let a=px;
  for(const step of [1,w]) for(let n=0;n<r;n++){ const b=a.slice();
    a.forEach((v,i)=>{ if(v){ if(i>=step) b[i-step]=1; if(i+step<b.length) b[i+step]=1; } }); a=b; }
  return a;
}
// A piece never quite meets the old edge. A cut along a door leaves a crust of the old shape outside it, which can close
// the cut off into a hole, and an add leaves a slit. So strips under twice RIBBON wide go too, but only beside the piece.
function clearRibbons(m,piece,cut){
  const inverse=a=>a.map(v=>1-v), near=spread(piece,m.w,2*RIBBON+1), thin=cut?m.px:inverse(m.px);
  const opened=spread(inverse(spread(inverse(thin),m.w,RIBBON)),m.w,RIBBON);
  m.px=m.px.map((v,i)=>near[i]&&thin[i]&&!opened[i]?(cut?0:1):v);
}
// The mask's edge as a closed list of pixel corners, as sam_helper.py's trace walks it
function traceMask(m){
  const {w,px}=m, on=(x,y)=>px[y*w+x]===1, first=px.indexOf(1), x0=first%w, y0=Math.floor(first/w), path=[];
  let x=x0, y=y0, heading=0;
  do{ path.push([x+m.x,y+m.y]); x+=STEPS[heading][0]; y+=STEPS[heading][1];
    const l=[[x,y-1],[x,y],[x-1,y],[x-1,y-1]][heading], r=[[x,y],[x-1,y],[x-1,y-1],[x,y-1]][heading];
    if(on(l[0],l[1])) heading=(heading+3)%4; else if(!on(r[0],r[1])) heading=(heading+1)%4;
  }while(x!==x0||y!==y0||heading!==0);
  return path;
}
// Douglas-Peucker on an open run of corners
function simplify(path,eps){
  const keep=new Set([0,path.length-1]), runs=[[0,path.length-1]];
  while(runs.length){ const [a,b]=runs.pop(); if(b-a<2) continue;
    const dx=path[b][0]-path[a][0], dy=path[b][1]-path[a][1], n=Math.hypot(dx,dy)||1; let far=-1, most=eps;
    for(let i=a+1;i<b;i++){ const d=Math.abs(dx*(path[i][1]-path[a][1])-dy*(path[i][0]-path[a][0]))/n; if(d>most){ most=d; far=i; } }
    if(far>=0){ keep.add(far); runs.push([a,far],[far,b]); } }
  return [...keep].sort((p,q)=>p-q).map(i=>path[i]);
}
// The walked edge as an outline, stopping at each old point that moved() doesn't rule out
function redrawn(path,old,moved){
  const pts=path.map(p=>p.slice()), stops=new Set();
  old.forEach(v=>{ if(moved(v)) return; let at=-1, near=1.5;
    path.forEach((p,i)=>{ const d=Math.hypot(p[0]-v[0],p[1]-v[1]); if(d<near){ near=d; at=i; } });
    if(at>=0){ pts[at]=v.slice(); stops.add(at); } });
  let at=[...stops].sort((a,b)=>a-b);
  if(at.length<2){ let far=0, most=-1;
    path.forEach((p,i)=>{ const d=Math.hypot(p[0]-path[0][0],p[1]-path[0][1]); if(d>most){ most=d; far=i; } });
    at=[0,far]; }
  return at.flatMap((a,k)=>{ const b=at[(k+1)%at.length];
    return simplify(b>a?pts.slice(a,b+1):pts.slice(a).concat(pts.slice(0,b+1)),EDGE_EPS).slice(0,-1); });
}
// An outline with a piece added or cut: {points, split}, or {why} when there's nothing to do
function reshape(old,piece,cut){
  const m=maskOver(old,piece); fillPoly(m,old,1); solidify(m);
  const before=m.px, area={...m,px:new Uint8Array(m.px.length)}; fillPoly(area,piece,1);
  m.px=before.map((v,i)=>area.px[i]?(cut?0:1):v);
  clearRibbons(m,area.px,cut);
  const pieces=solidify(m);
  if(cut&&m.px.indexOf(1)<0) return {why:"all"};
  if(!cut&&pieces>1) return {why:"apart"};
  if(m.px.every((v,i)=>v===before[i])) return {why:cut?"inside":"apart"};
  const moved=v=>{ const cx=Math.floor(v[0])-m.x, cy=Math.floor(v[1])-m.y;
    for(let y=Math.max(0,cy-3);y<Math.min(m.h,cy+3);y++) for(let x=Math.max(0,cx-3);x<Math.min(m.w,cx+3);x++)
      if(m.px[y*m.w+x]!==before[y*m.w+x]) return true;
    return false; };
  return {points:redrawn(traceMask(m),old,moved),split:pieces>1};
}

document.getElementById("btnFit").onclick=()=>{ fit(); draw(); };
document.getElementById("btnZoomIn").onclick=()=>{ zoomAt(1.2,cv.clientWidth/2,cv.clientHeight/2); draw(); };
document.getElementById("btnZoomOut").onclick=()=>{ zoomAt(1/1.2,cv.clientWidth/2,cv.clientHeight/2); draw(); };
document.getElementById("btnClear").onclick=()=>{ if(!shapes.length)return; if(confirm("Delete all "+shapes.length+" shapes?")){ pushUndo(); shapes=[]; sel=-1; draw(); } };

// ---- image load ----
const fileImg=document.getElementById("fileImg"), fileJson=document.getElementById("fileJson");
document.getElementById("btnLoadImg").onclick=()=>fileImg.click();
fileImg.onchange=()=>{ const f=fileImg.files[0]; if(f) loadImageFile(f); fileImg.value=""; };
function loadImageFile(f){ const rd=new FileReader(); rd.onload=()=>setImage(rd.result, f.name, ()=>flash("Loaded "+f.name)); rd.readAsDataURL(f); }
// drag & drop
addEventListener("dragover",e=>{ e.preventDefault(); dropEl.style.display="flex"; });
addEventListener("dragleave",e=>{ if(e.relatedTarget===null) dropEl.style.display="none"; });
addEventListener("drop",e=>{ e.preventDefault(); dropEl.style.display="none";
  const f=[...e.dataTransfer.files].find(f=>f.type.startsWith("image/")); if(f) loadImageFile(f);
  else { const jf=[...e.dataTransfer.files].find(f=>f.name.endsWith(".json")); if(jf) loadJsonFile(jf); } });
// paste
addEventListener("paste",e=>{ const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));
  if(it){ const f=it.getAsFile(); if(f){ f.name?loadImageFile(f):setImage(URL.createObjectURL(f),"pasted"); flash("Pasted image"); } } });

// ---- JSON save / load ----
function serialize(s){
  const r=v=>+(+v).toFixed(1), o={type:s.type,label:s.label||"",color:s.color};
  if(s.type==="point"){o.x=r(s.x);o.y=r(s.y);}
  else if(s.type==="line"){o.x1=r(s.x1);o.y1=r(s.y1);o.x2=r(s.x2);o.y2=r(s.y2);}
  else if(isPoly(s)){o.points=s.points.map(([x,y])=>[r(x),r(y)]);}
  else{o.cx=r(s.cx);o.cy=r(s.cy);o.rx=r(s.rx);o.ry=r(s.ry); if(s.type==="ellipse"&&Math.abs(normRot(rot(s)))>=.05) o.rotation=r(normRot(rot(s)));}
  return o;
}
// The calibration payload — image is name + dimensions + the shapes (coords in image
// space). The full image is embedded (base64) ONLY when "embed image" is ticked; by
// default the file stays small and just references the image by name.
function buildPayload(){
  const embed=document.getElementById("embed").checked;
  return { type:"mj-calibration", version:1,
    image:{ name:imgName, width:ART_W, height:ART_H, data:(embed&&imgReady)?img.src:null },
    shapes: shapes.map(serialize) };
}
document.getElementById("btnSave").onclick=()=>{
  const base=(imgName||"calibration").replace(/\.[^.]+$/,"");
  const blob=new Blob([JSON.stringify(buildPayload(),null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=base+".calib.json"; a.click();
  URL.revokeObjectURL(a.href); flash("Saved "+a.download+" ("+shapes.length+" shapes)");
};
document.getElementById("btnCopy").onclick=async()=>{
  const json=JSON.stringify(buildPayload(),null,2);
  try{ await navigator.clipboard.writeText(json); flash("Copied JSON to clipboard ("+shapes.length+" shapes)"); }
  catch(e){ flash("Copy failed — clipboard blocked in this context"); }
};
document.getElementById("btnLoad").onclick=()=>fileJson.click();
fileJson.onchange=()=>{ const f=fileJson.files[0]; if(f) loadJsonFile(f); fileJson.value=""; };
function loadJsonFile(f){ const rd=new FileReader(); rd.onload=()=>{ try{ applyJson(JSON.parse(rd.result), f.name); }catch(err){ flash("Bad JSON: "+err.message); } }; rd.readAsText(f); }
// A doors.json from @overlore's SAM run: {image,width,height,doors:{name:[[x,y],...]}}, opened as outlines on the picture
// already loaded, to fix rather than mark from nothing.
function doorsToShapes(data){
  if(!imgReady){ flash("Load its picture first"); return null; }
  if(data.width!==ART_W||data.height!==ART_H){ flash("Those outlines are for a "+data.width+"×"+data.height+" picture"); return null; }
  if(data.image&&data.image!==imgName&&!confirm("These outlines are for "+data.image+", and this is "+imgName+". Open them anyway?")) return null;
  return {shapes:Object.entries(data.doors).map(([label,points])=>({type:"outline",label,points}))};
}
function applyJson(data,fname){
  if(data&&data.doors&&!data.shapes){ data=doorsToShapes(data); if(!data) return; }
  if(!data||!Array.isArray(data.shapes)) return flash("Not a calibration file");
  const load=()=>{ pushUndo(); sam=null; shapes=data.shapes.map(s=>({label:"",color:currentColor,...s})); sel=-1;
    if(data.image&&data.image.width&&!data.image.data){ ART_W=data.image.width; ART_H=data.image.height; if(!imgReady){fit();} }
    draw(); flash("Loaded "+(fname||"json")+" ("+shapes.length+" shapes)"); };
  if(data.image&&data.image.data) setImage(data.image.data, data.image.name||fname, load); else load();
}

// ---- boot ----
addEventListener("resize",resize);
setTool("point"); pickColor(PALETTE[0]); resize();
</script>
